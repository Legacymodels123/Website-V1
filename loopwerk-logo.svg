<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Brand guide: verweven X uit vier afgeronde banden -->
  <!-- Band 1 (\) onder in het midden -->
  <path d="M46 46 L78 78" stroke="#6B7F4A" stroke-width="12" stroke-linecap="round"/>
  <!-- Band 2 (/) onder in het midden -->
  <path d="M54 46 L22 78" stroke="#D97F63" stroke-width="12" stroke-linecap="round"/>
  <!-- Band 3 (\) boven in het midden -->
  <path d="M22 22 L54 54" stroke="#1E3B2E" stroke-width="12" stroke-linecap="round"/>
  <!-- Band 4 (/) boven in het midden -->
  <path d="M78 22 L46 54" stroke="#6B7F4A" stroke-width="12" stroke-linecap="round"/>
</svg>
